name: to_do_list
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  shimmer: ^4.0.0
  sqflite: ^2.4.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: "Font 8"
      fonts:
        - asset: assets/fonts/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyahsans-Black.otf
          weight: 900
        - asset: assets/fonts/thmanyahsans-Light.otf
          weight: 300
    - family: Thmanyah
      fonts:
        - asset: assets/fonts/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyahsans-Black.otf
          weight: 900
        - asset: assets/fonts/thmanyahsans-Light.otf
          weight: 300
